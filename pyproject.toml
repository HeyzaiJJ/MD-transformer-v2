[project]
name = "md-transformer-v2"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pillow>=10.1,<11",
  "pydantic>=2.4,<3",
  "pydantic-settings>=2,<3",
  "transformers>=5.12,<6",
  "torch>=2.7,<3",
  "psutil>=7,<8",
  "tqdm>=4.66,<5",
  "ftfy>=6.1,<7",
  "rapidfuzz>=3.8,<4",
  "surya-ocr>=0.22.1,<0.23",
  "regex>=2024.4.28",
  "pdftext>=0.7,<0.8",
  "markdownify>=1.1,<2",
  "click>=8.2,<9",
  "markdown2>=2.5,<3",
  "filetype>=1.2,<2",
  "google-genai>=1.40,<3",
  "anthropic>=0.69,<1",
  "openai>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "python-dotenv>=1,<2",
]
[project.scripts]
md-transformer = "md_transformer.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["marker*", "md_transformer*"]


